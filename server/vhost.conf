<VirtualHost *:80>
    ServerName detour.ten50.nl
    DocumentRoot /var/www/detour.ten50.nl/current
    ErrorLog /var/log/apache2/sites/detour.ten50.nl/error.log
    CustomLog /var/log/apache2/sites/detour.ten50.nl/access.log combined
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://detour.ten50.nl%{REQUEST_URI} [R=301,L]
    <Directory /var/www/detour.ten50.nl>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
<VirtualHost *:443>
    ServerName detour.ten50.nl
    DocumentRoot /var/www/detour.ten50.nl/current
    ErrorLog /var/log/apache2/sites/detour.ten50.nl/error.log
    CustomLog /var/log/apache2/sites/detour.ten50.nl/access.log combined
    <Directory /var/www/detour.ten50.nl>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <IfModule mod_headers.c>
        Header always set Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        <FilesMatch "\.(woff2|png|svg|ico)$">
            Header set Cache-Control "public, max-age=2592000"
        </FilesMatch>
        <FilesMatch "\.(css|js)$">
            Header set Cache-Control "public, max-age=3600"
        </FilesMatch>
    </IfModule>
    SSLEngine on
    <IfFile /etc/letsencrypt/live/detour.ten50.nl/fullchain.pem>
        SSLCertificateFile /etc/letsencrypt/live/detour.ten50.nl/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/detour.ten50.nl/privkey.pem
    </IfFile>
    <IfFile !/etc/letsencrypt/live/detour.ten50.nl/fullchain.pem>
        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    </IfFile>
</VirtualHost>
